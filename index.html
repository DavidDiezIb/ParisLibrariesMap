<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librairies de Paris</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1612; --paper: #f5f0e8; --cream: #ede8dc;
    --rust: #b5401c; --gold: #c8922a; --warm-gray: #8a8070;
    --border: rgba(26,22,18,0.12); --shadow: 0 4px 24px rgba(26,22,18,0.12);
  }
  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--ink); padding: 0 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; border-bottom: 2px solid var(--rust);
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--paper); letter-spacing: 0.02em; }
  .logo span { color: var(--gold); font-style: italic; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .header-count { font-size: 0.78rem; color: var(--warm-gray); font-weight: 300; letter-spacing: 0.04em; }

  #osm-banner {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.75rem; color: var(--gold);
    background: rgba(200,146,42,0.12); border: 1px solid rgba(200,146,42,0.3);
    padding: 4px 12px; border-radius: 20px; transition: opacity 0.5s;
  }
  #osm-banner.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 12px; height: 12px; border: 2px solid rgba(200,146,42,0.3);
    border-top-color: var(--gold); border-radius: 50%;
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .app { display: flex; height: 100vh; padding-top: 56px; }

  .sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--paper); border-right: 1px solid var(--border);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .sidebar-section { padding: 1.1rem 1.25rem 0.6rem; border-bottom: 1px solid var(--border); }
  .section-label {
    font-size: 0.65rem; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--warm-gray); margin-bottom: 0.65rem;
  }

  .osm-status {
    font-size: 0.72rem; color: var(--warm-gray);
    padding-bottom: 0.6rem; margin-bottom: 0.5rem;
    border-bottom: 1px dashed var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .osm-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warm-gray); flex-shrink: 0; transition: background 0.4s; }
  .osm-dot.live { background: #4a9e5c; animation: pulse 2s infinite; }
  .osm-dot.error { background: var(--rust); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .source-toggle { display: flex; gap: 6px; }
  .src-btn {
    flex: 1; padding: 0.35rem 0; border-radius: 5px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.72rem;
    border: 1px solid var(--border); background: none; color: var(--warm-gray);
    transition: all 0.15s;
  }
  .src-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .cat-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; background: none; border: none;
    padding: 0.5rem 0.6rem; margin-bottom: 3px;
    border-radius: 6px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.875rem; color: var(--ink);
    transition: background 0.15s; text-align: left;
  }
  .cat-btn:hover { background: var(--cream); }
  .cat-btn.active { background: var(--cream); font-weight: 500; }
  .cat-btn.inactive { opacity: 0.35; }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cat-label { flex: 1; }
  .cat-count { font-size: 0.73rem; color: var(--warm-gray); background: var(--cream); padding: 1px 7px; border-radius: 10px; min-width: 22px; text-align: center; }

  .filter-actions { display: flex; gap: 8px; margin-bottom: 0.65rem; }
  .filter-btn {
    flex: 1; padding: 0.38rem; border-radius: 5px;
    border: 1px solid var(--border); background: none;
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; cursor: pointer; color: var(--ink);
    transition: background 0.15s;
  }
  .filter-btn:hover { background: var(--cream); }

  .shop-list { padding: 0 0.75rem 2rem; }
  .shop-item {
    padding: 0.7rem 0.5rem; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.1s; border-radius: 4px;
  }
  .shop-item:hover { background: var(--cream); }
  .shop-item.hidden { display: none; }
  .shop-name { font-size: 0.875rem; font-weight: 500; margin-bottom: 3px; color: var(--ink); }
  .shop-meta { font-size: 0.73rem; color: var(--warm-gray); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .shop-cat-tag { padding: 1px 6px; border-radius: 3px; font-size: 0.67rem; font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; }
  .src-badge { font-size: 0.62rem; padding: 1px 5px; border-radius: 3px; background: rgba(26,22,18,0.06); color: var(--warm-gray); }

  #map { flex: 1; z-index: 0; }

  .leaflet-popup-content-wrapper {
    background: var(--ink) !important; color: var(--paper) !important;
    border-radius: 8px !important; box-shadow: var(--shadow) !important;
    border: none !important; font-family: 'DM Sans', sans-serif !important; padding: 0 !important;
  }
  .leaflet-popup-content { margin: 0 !important; width: 255px !important; }
  .leaflet-popup-tip { background: var(--ink) !important; }
  .leaflet-popup-close-button { color: var(--warm-gray) !important; top: 10px !important; right: 10px !important; font-size: 18px !important; }

  .popup-inner { padding: 1rem 1.1rem 0.9rem; }
  .popup-cat { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; margin-bottom: 5px; opacity: 0.65; }
  .popup-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; line-height: 1.3; margin-bottom: 0.35rem; color: var(--paper); }
  .popup-address { font-size: 0.73rem; opacity: 0.55; margin-bottom: 0.5rem; line-height: 1.45; }
  .popup-rating { display: flex; align-items: center; gap: 6px; font-size: 0.77rem; margin-bottom: 4px; }
  .popup-stars { color: var(--gold); letter-spacing: -1px; }
  .popup-sep { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.55rem 0; }
  .popup-detail { font-size: 0.71rem; opacity: 0.55; line-height: 1.5; margin-bottom: 3px; }
  .popup-tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 3px; }
  .popup-tag { padding: 1px 6px; border-radius: 3px; font-size: 0.64rem; font-weight: 500; }
  .popup-osm-link { display: inline-block; margin-top: 7px; font-size: 0.68rem; color: rgba(200,146,42,0.75); text-decoration: none; }
  .popup-osm-link:hover { color: var(--gold); text-decoration: underline; }

  .legend {
    background: var(--ink); border-radius: 8px;
    padding: 0.75rem 1rem; box-shadow: var(--shadow);
  }
  .legend-title { font-size: 0.59rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 0.5rem; font-weight: 500; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.71rem; color: var(--paper); margin-bottom: 4px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-sep { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 5px 0; }

  .search-wrap { padding: 1rem 1.25rem 0.75rem; border-bottom: 1px solid var(--border); }
  .search-input {
    width: 100%; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--cream); font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; color: var(--ink); outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--rust); }
  .search-input::placeholder { color: var(--warm-gray); }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .leaflet-control-attribution { font-size: 10px !important; }
</style>
</head>
<body>

<header>

</div>

// ─────────────────────────────────────────────
// OSM CLASSIFIER
// ─────────────────────────────────────────────
function classifyOSM(tags) {
  const name = (tags.name || '').toLowerCase();
  const any  = Object.values(tags).join(' ').toLowerCase();

  if (tags.amenity === 'library') return 'library';

  if (name.includes('bouquiniste') || (tags.shop === 'books' && (name.includes('quai') || any.includes('quai')))) return 'bouquiniste';

  if (tags.second_hand === 'yes' || tags.second_hand === 'only') return 'secondhand';
  if (any.match(/\boccasion\b|\bused\b|\bgebraucht\b/)) return 'secondhand';

  if (any.match(/\bancien|\bantiquarian|\brare|\boutdated/)) return 'ancient';

  if (any.match(/\bjeunesse|\benfant|\bchildren|\bkinder/)) return 'children';

  if (any.match(/\benglish|\banglais|\banglophone|\bshakespeare|\babbe[y]?\b/)) return 'english';

  if (any.match(/\blgbtq|\blgbt\+?|\bgay\b|\bqueer|\blesbien/)) return 'lgbtq';

  const specialKw = ['philosophi','droit','médecin','scienc','techniqu','informatiqu','architect','art\b','musiqu','voyage','religio','ésotér','bande dessin','comics','manga','théolog','histoir','géograph','politi','économi','univers','académi','profess'];
  if (specialKw.some(k => new RegExp(k).test(any))) return 'specialty';
  if (tags.subject) return 'specialty';

  return 'general';
}

function osmToShop(el) {
  const tags = el.tags || {};
  const lat  = el.type === 'node' ? el.lat : el.center?.lat;
  const lng  = el.type === 'node' ? el.lon : el.center?.lon;
  if (!lat || !lng) return null;

  const name    = tags.name || tags['name:fr'] || 'Librairie';
  const addrParts = [tags['addr:housenumber'], tags['addr:street'], tags['addr:postcode']].filter(Boolean);
  const address = addrParts.length ? addrParts.join(' ') : (tags['addr:full'] || '');
  const hours   = tags.opening_hours || null;
  const website = tags.website || tags['contact:website'] || '';
  const phone   = tags.phone   || tags['contact:phone']   || '';
  const note    = [
    tags.description || tags['description:fr'],
    website ? `🌐 ${website.replace(/^https?:\/\//,'')}` : null,
    phone   ? `📞 ${phone}` : null,
  ].filter(Boolean).join(' · ') || null;

  const extraTags = ['subject','genre','books','second_hand','speciality']
    .map(k => tags[k]).filter(Boolean).slice(0,4);

  return {
    id: `osm_${el.type}_${el.id}`,
    name, lat, lng,
    category: classifyOSM(tags),
    address, rating: null, rc: null,
    hours, note,
    tags: extraTags,
    source: 'osm',
    osmUrl: `https://www.openstreetmap.org/${el.type}/${el.id}`,
  };
}

let activeCategories = new Set(Object.keys(CATEGORIES));
let markers = {};
let searchQuery = '';
let sourceFilter = 'all';

// ─────────────────────────────────────────────
// ICONS
// ─────────────────────────────────────────────
function makeIcon(color, small) {
  const w = small ? 20 : 28, h = small ? 26 : 36, r = small ? 4 : 5.5;
  return L.divIcon({
    className:'',
    html:`<div style="width:${w}px;height:${h}px"><svg viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><path d="M14 0C6.27 0 0 6.27 0 14c0 9.625 12.5 22 14 22S28 23.625 28 14C28 6.27 21.73 0 14 0z" fill="${color}"/><circle cx="14" cy="14" r="${r}" fill="white" fill-opacity="0.85"/></svg></div>`,
    iconSize:[w,h], iconAnchor:[w/2,h], popupAnchor:[0,-h],
  });
}

// ─────────────────────────────────────────────
// POPUP
// ─────────────────────────────────────────────
function buildPopup(s) {
  const cat   = CATEGORIES[s.category] || CATEGORIES.unknown;
  const stars = s.rating ? ('★'.repeat(Math.round(s.rating)) + '☆'.repeat(5-Math.round(s.rating))) : null;
  const tagsHtml = s.tags && s.tags.length
    ? `<div class="popup-tags">${s.tags.map(t=>`<span class="popup-tag" style="background:${cat.bg};color:${cat.color}">${t}</span>`).join('')}</div>` : '';
  const footer = s.source === 'curated'
    ? `<span style="opacity:0.35;font-size:0.63rem">● Sélection éditoriale</span>`
    : `<a class="popup-osm-link" href="${s.osmUrl}" target="_blank" rel="noopener">↗ Voir sur OpenStreetMap</a>`;
  return `<div class="popup-inner">
    <div class="popup-cat" style="color:${cat.color}">${cat.label}</div>
    <div class="popup-name">${s.name}</div>
    ${s.address ? `<div class="popup-address">${s.address}</div>` : ''}
    ${stars ? `<div class="popup-rating"><span class="popup-stars">${stars}</span><span style="opacity:0.55">${s.rating} · ${s.rc.toLocaleString('fr')} avis</span></div>` : ''}
    ${tagsHtml}
    ${(s.hours||s.note)?'<hr class="popup-sep">':''}
    ${s.hours ? `<div class="popup-detail">🕐 ${s.hours}</div>` : ''}
    ${s.note  ? `<div class="popup-detail" style="margin-top:2px">${s.note}</div>` : ''}
    <hr class="popup-sep">
    ${footer}
  </div>`;
}

// ─────────────────────────────────────────────
// DEDUP: skip OSM entries too close to a curated one (~60m)
// ─────────────────────────────────────────────
function isDuplicate(osm) {
  return CURATED.some(c => {
    const dy = (c.lat - osm.lat) * 111320;
    const dx = (c.lng - osm.lng) * 111320 * Math.cos(c.lat * Math.PI/180);
    return Math.sqrt(dx*dx + dy*dy) < 60;
  });
}

// ─────────────────────────────────────────────
// RENDER A SHOP (add marker)
// ─────────────────────────────────────────────
function renderShop(s) {
  if (markers[s.id]) return;
  const cat = CATEGORIES[s.category] || CATEGORIES.unknown;
  const m = L.marker([s.lat, s.lng], { icon: makeIcon(cat.color, s.source === 'osm') })
    .bindPopup(buildPopup(s), { maxWidth:280 });
  m.addTo(map);
  markers[s.id] = m;
}

// ─────────────────────────────────────────────
// VISIBILITY
// ─────────────────────────────────────────────
function visibleSet() {
  const q = searchQuery.toLowerCase();
  return new Set(ALL_SHOPS.filter(s => {
    if (!activeCategories.has(s.category)) return false;
    if (sourceFilter === 'curated' && s.source !== 'curated') return false;
    if (sourceFilter === 'osm'     && s.source !== 'osm')     return false;
    if (q) {
      const hay = [s.name, ...(s.tags||[]), s.address||'', s.note||''].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).map(s => s.id));
}

function updateVisibility() {
  const vs = visibleSet();
  ALL_SHOPS.forEach(s => {
    const m = markers[s.id];
    if (!m) return;
    if (vs.has(s.id)) { if (!map.hasLayer(m)) map.addLayer(m); }
    else              { if ( map.hasLayer(m)) map.removeLayer(m); }
  });
  const n = vs.size;
  document.getElementById('header-count').textContent = `${n} librairie${n>1?'s':''} affichée${n>1?'s':''}`;
  document.querySelectorAll('.shop-item').forEach(el => {
    el.classList.toggle('hidden', !vs.has(el.dataset.id));
  });
}

// ─────────────────────────────────────────────
// SIDEBAR — CATEGORY FILTERS
// ─────────────────────────────────────────────
function rebuildCatFilters() {
  const el = document.getElementById('cat-filters');
  el.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const n = ALL_SHOPS.filter(s => s.category === key).length;
    if (!n) return;
    let btn = document.getElementById('catbtn-'+key);
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'catbtn-'+key;
      btn.className = 'cat-btn active';
      btn.addEventListener('click', () => {
        if (activeCategories.has(key)) {
          activeCategories.delete(key);
          btn.classList.replace('active','inactive');
        } else {
          activeCategories.add(key);
          btn.classList.replace('inactive','active');
        }
        updateVisibility();
      });
    }
    btn.innerHTML = `
      <span class="cat-dot" style="background:${cat.color}"></span>
      <span class="cat-label">${cat.label}</span>
      <span class="cat-count">${n}</span>`;
    el.appendChild(btn);
  });
}

// ─────────────────────────────────────────────
// SIDEBAR — SHOP LIST
// ─────────────────────────────────────────────
function rebuildList() {
  const listEl = document.getElementById('shop-list');
  // keep existing items, only add new ones
  const existing = new Set([...listEl.querySelectorAll('.shop-item')].map(e => e.dataset.id));
  const sorted = [...ALL_SHOPS].sort((a,b) => a.name.localeCompare(b.name,'fr'));
  sorted.forEach(s => {
    if (existing.has(s.id)) return;
    const cat = CATEGORIES[s.category] || CATEGORIES.unknown;
    const item = document.createElement('div');
    item.className = 'shop-item';
    item.dataset.id = s.id;
    const badge = s.source === 'curated'
      ? `<span class="src-badge" style="background:rgba(45,74,122,0.08);color:#2d4a7a">★</span>`
      : `<span class="src-badge">OSM</span>`;
    item.innerHTML = `
      <div class="shop-name">${s.name}</div>
      <div class="shop-meta">
        <span class="shop-cat-tag" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>
        ${s.rating ? `<span>★ ${s.rating}</span>` : ''}
        ${badge}
      </div>`;
    item.addEventListener('click', () => {
      map.setView([s.lat, s.lng], 17, { animate:true });
      markers[s.id]?.openPopup();
    });
    listEl.appendChild(item);
  });
  // Re-sort DOM to match sorted order
  sorted.forEach(s => { const el = listEl.querySelector(`[data-id="${s.id}"]`); if (el) listEl.appendChild(el); });
}

// ─────────────────────────────────────────────
// LEGEND
// ─────────────────────────────────────────────
function buildLegend() {
  const legend = L.control({ position:'bottomright' });
  legend.onAdd = () => {
    const div = L.DomUtil.create('div','legend');
    div.innerHTML = '<div class="legend-title">Catégories</div>' +
      Object.entries(CATEGORIES).map(([k,cat]) =>
        `<div class="legend-item" id="leg-${k}" style="display:none"><span class="legend-dot" style="background:${cat.color}"></span>${cat.label}</div>`
      ).join('') +
      `<hr class="legend-sep">
       <div class="legend-item"><span class="legend-dot" style="background:#2d4a7a"></span>Sélection éditoriale</div>
       <div class="legend-item"><span class="legend-dot" style="background:#999;opacity:0.7"></span>OpenStreetMap</div>`;
    return div;
  };
  legend.addTo(map);
}

function updateLegend() {
  Object.keys(CATEGORIES).forEach(k => {
    const el = document.getElementById('leg-'+k);
    if (el) el.style.display = ALL_SHOPS.some(s=>s.category===k) ? 'flex' : 'none';
  });
}

// ─────────────────────────────────────────────
// SOURCE FILTER
// ─────────────────────────────────────────────
function setSource(src, btn) {
  sourceFilter = src;
  document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateVisibility();
}

// ─────────────────────────────────────────────
// TOGGLE ALL
// ─────────────────────────────────────────────
function toggleAll(state) {
  activeCategories = state ? new Set(Object.keys(CATEGORIES)) : new Set();
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', state);
    b.classList.toggle('inactive', !state);
  });
  updateVisibility();
}

// ─────────────────────────────────────────────
// OVERPASS API
// Paris bbox (S,W,N,E)
// ─────────────────────────────────────────────
const BBOX = '48.815,2.225,48.905,2.470';
const QUERY = `[out:json][timeout:30];
(
  node["shop"="books"](${BBOX});
  way["shop"="books"](${BBOX});
  node["shop"="book"](${BBOX});
  node["amenity"="library"](${BBOX});
  way["amenity"="library"](${BBOX});
);
out center tags;`;


async function fetchOSM(query, useProxy = false) {
  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://z.overpass-api.de/api/interpreter'
  ];
  for (const endpoint of endpoints) {
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query)
      });
      if (res.ok) return res;
    } catch (e) { }
  }
  return null;
}

async function fetchOSM() {
  const banner     = document.getElementById('osm-banner');
  const bannerText = document.getElementById('osm-banner-text');
  const dot        = document.getElementById('osm-dot');
  const statusText = document.getElementById('osm-status-text');

  try {
    bannerText.textContent = 'Interrogation Overpass API…';

    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      headers: { 'Content-Type':'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(QUERY),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    bannerText.textContent = 'Traitement des données…';
    const json = await res.json();

    const osmShops = (json.elements || [])
      .map(osmToShop)
      .filter(s => s && !isDuplicate(s));

    // Merge into global list
    ALL_SHOPS = [...CURATED, ...osmShops];

    // Add markers for new OSM entries
    osmShops.forEach(renderShop);

    // Rebuild UI
    rebuildCatFilters();
    rebuildList();
    updateLegend();
    updateVisibility();

    // Status: success
    dot.classList.add('live');
    const t = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    statusText.textContent = `${osmShops.length} entrées OSM · MàJ ${t}`;
    banner.classList.add('hidden');

  } catch (err) {
    console.warn('OSM fetch error:', err);
    dot.classList.add('error');
    statusText.textContent = 'Erreur OSM — données hors-ligne uniquement';
    document.getElementById('osm-spinner').style.display = 'none';
    bannerText.textContent = 'Erreur OSM';
    setTimeout(() => banner.classList.add('hidden'), 3500);
  }
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  updateVisibility();
});

// ─────────────────────────────────────────────
// BOOT — curated data renders immediately,
//        OSM loads asynchronously in background
// ─────────────────────────────────────────────
CURATED.forEach(renderShop);
rebuildCatFilters();
rebuildList();
buildLegend();
updateLegend();
updateVisibility();

fetchOSM(); // non-blocking
</script>
</body>
</html>
